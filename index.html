<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idle Adventure</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0d1117; color:#e6edf3;
    font-family:"Trebuchet MS","Comic Sans MS",Verdana,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:12px;
  }
  #wrap { position:relative; width:min(960px,100%); }
  canvas {
    width:100%; display:block; border-radius:12px;
    border:3px solid #2d333b; background:#87ceeb;
    box-shadow:0 8px 40px rgba(0,0,0,.6);
  }
  #hud {
    position:absolute; top:10px; left:10px; right:10px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none;
  }
  #plate {
    background:rgba(13,17,23,.78); border:2px solid #2d333b;
    border-radius:10px; padding:8px 12px; display:flex; gap:10px; align-items:center;
  }
  #lv {
    width:52px; height:52px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffd76a, #e8930c);
    color:#3a2500; font-weight:bold; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    border:2px solid #fff3; flex-shrink:0;
  }
  .bars { display:flex; flex-direction:column; gap:5px; width:230px; }
  .bar { position:relative; height:16px; background:#1c2128; border-radius:8px; overflow:hidden; border:1px solid #444c56; }
  .bar > i { position:absolute; inset:0; border-radius:8px; transition:width .2s; }
  #hpFill { background:linear-gradient(#ff6b6b,#d92626); }
  #mpFill { background:linear-gradient(#5aa9ff,#1f6feb); }
  #xpFill { background:linear-gradient(#ffe066,#f0a500); }
  .bar > span {
    position:absolute; inset:0; font-size:11px; font-weight:bold; color:#fff;
    display:flex; align-items:center; justify-content:center;
    text-shadow:0 1px 2px #000;
  }
  #stats {
    background:rgba(13,17,23,.78); border:2px solid #2d333b; border-radius:10px;
    padding:8px 14px; font-size:14px; font-weight:bold; text-align:right; line-height:1.5;
  }
  #stats .gold { color:#ffd76a; }
  #zone {
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    background:rgba(13,17,23,.6); border-radius:8px; padding:4px 16px;
    font-weight:bold; letter-spacing:2px; font-size:13px; color:#cfe3ff;
    pointer-events:none;
  }
  #banner {
    position:absolute; top:34%; left:0; right:0; text-align:center;
    font-size:64px; font-weight:900; color:#ffe066;
    text-shadow:0 0 24px #f0a500, 0 4px 0 #7a4d00, 0 6px 12px #000;
    opacity:0; transform:scale(.6); pointer-events:none;
  }
  #banner.show { animation:pop 1.8s ease-out forwards; }
  @keyframes pop {
    0% { opacity:0; transform:scale(.6); }
    15% { opacity:1; transform:scale(1.15); }
    30% { transform:scale(1); }
    75% { opacity:1; }
    100% { opacity:0; transform:scale(1.05) translateY(-16px); }
  }
  #feed {
    position:absolute; left:10px; bottom:10px; width:280px;
    display:flex; flex-direction:column-reverse; gap:3px; pointer-events:none;
  }
  #feed div {
    background:rgba(13,17,23,.7); border-radius:6px; padding:3px 10px;
    font-size:12px; color:#bfe3ff; animation:fadeout 6s forwards;
  }
  @keyframes fadeout { 0%,70% {opacity:1;} 100% {opacity:0;} }
  #controls { position:absolute; right:10px; bottom:10px; display:flex; gap:8px; }
  button {
    font-family:inherit; font-weight:bold; cursor:pointer;
    background:#238636; color:#fff; border:2px solid #2ea043; border-radius:8px;
    padding:8px 14px; font-size:14px;
  }
  button:hover { background:#2ea043; }
  #hint { text-align:center; margin-top:8px; color:#8b949e; font-size:13px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="hud">
    <div id="plate">
      <div id="lv">1</div>
      <div class="bars">
        <div class="bar"><i id="hpFill"></i><span id="hpTxt"></span></div>
        <div class="bar"><i id="mpFill"></i><span id="mpTxt"></span></div>
        <div class="bar"><i id="xpFill"></i><span id="xpTxt"></span></div>
      </div>
    </div>
    <div id="stats">
      <div class="gold">Gold: <span id="gold">0</span></div>
      <div>Kills: <span id="kills">0</span></div>
      <div>ATK <span id="atk">8</span></div>
    </div>
  </div>
  <div id="zone">SLIME MEADOW</div>
  <div id="banner"></div>
  <div id="feed"></div>
  <div id="controls"><button id="speed">1x</button></div>
  <div id="hint">Fully automatic. Your hero fights, loots and levels on their own. Sit back.</div>
</div>
<script>
(() => {
"use strict";
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const W = 960, H = 540, GROUND = H - 88;
const R = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------------- state ---------------- */
const P = {
  x: W/2, dir: 1, speed: 100,
  level: 1, exp: 0, hp: 60, maxHp: 60, mp: 30, maxMp: 30, atk: 9,
  gold: 0, kills: 0,
  attackT: 0, skillT: 0, swing: 0, walkPhase: 0,
  dead: 0, hurtFlash: 0, idleT: 0, idleDir: 1,
};
const expNext = l => Math.floor(25 * Math.pow(l, 1.7));

const TYPES = [
  { name:'Green Slime',    min:1,  hp:34,  atk:4,  exp:14,  gold:6,  kind:'slime'  },
  { name:'Orange Mushroom',min:3,  hp:64,  atk:7,  exp:28,  gold:11, kind:'mush'   },
  { name:'Ribbon Pig',     min:6,  hp:120, atk:11, exp:52,  gold:20, kind:'pig'    },
  { name:'Dark Slime',     min:10, hp:220, atk:17, exp:98,  gold:36, kind:'dslime' },
  { name:'Fire Mushroom',  min:15, hp:380, atk:26, exp:175, gold:60, kind:'fmush'  },
];
const ZONES = [[1,'SLIME MEADOW'],[6,'MUSHROOM GROVE'],[11,'DARK HOLLOW'],[16,'EMBER FIELDS']];

let monsters = [], parts = [], dmgNums = [], clouds = [], shake = 0, spawnT = 0, speedMul = 1;
for (let i = 0; i < 5; i++) clouds.push({ x: R(0, W), y: R(30, 150), s: R(.6, 1.4), v: R(6, 16) });

function availTypes() { return TYPES.filter(t => t.min <= P.level); }
function spawnMonster() {
  const pool = availTypes(), t = pool[(Math.random() * pool.length) | 0];
  const lv = P.level, sc = 1 + 0.22 * (lv - 1);
  let x = R(50, W - 50);
  if (Math.abs(x - P.x) < 240) x = W - x; // not on top of the hero
  monsters.push({
    type: t, kind: t.kind, x: clamp(x, 40, W - 40), dir: Math.random() < .5 ? -1 : 1,
    hp: Math.round(t.hp * sc), maxHp: Math.round(t.hp * sc),
    atk: Math.round(t.atk * (1 + 0.12 * (lv - 1))),
    exp: Math.round(t.exp * (1 + 0.25 * (lv - 1))),
    gold: Math.round(t.gold * (1 + 0.2 * (lv - 1))),
    wanderT: R(1, 3), hop: R(0, 6), attackT: R(.5, 1.2), flash: 0, dead: 0, deadT: 0,
  });
}

/* ---------------- fx ---------------- */
function burst(x, y, n, colors, spd) {
  for (let i = 0; i < n; i++) {
    const a = R(0, Math.PI * 2), s = R(spd * .3, spd);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60,
      life: R(.4, .9), max: .9, c: colors[(Math.random() * colors.length) | 0], sz: R(2, 5) });
  }
}
function dmgNum(x, y, txt, crit, hurt) {
  dmgNums.push({ x: x + R(-8, 8), y, txt, life: .9, crit: !!crit, hurt: !!hurt, vy: -90 });
}
function feed(msg) {
  const f = document.getElementById('feed'), d = document.createElement('div');
  d.textContent = msg; f.prepend(d);
  while (f.children.length > 6) f.lastChild.remove();
  setTimeout(() => d.remove(), 6100);
}
function banner(txt) {
  const b = document.getElementById('banner');
  b.textContent = txt; b.classList.remove('show');
  void b.offsetWidth; b.classList.add('show');
}

/* ---------------- combat ---------------- */
function gainExp(n) {
  P.exp += n;
  while (P.exp >= expNext(P.level)) {
    P.exp -= expNext(P.level); P.level++;
    P.maxHp += 14; P.maxMp += 7; P.atk += 3;
    P.hp = P.maxHp; P.mp = P.maxMp;
    banner('LEVEL UP!');
    burst(P.x, GROUND - 70, 40, ['#ffe066', '#fff3b0', '#f0a500'], 260);
    feed('Level ' + P.level + ' reached! Stats up, fully healed.');
  }
}
function playerAttack(m, skill) {
  const mult = skill ? 2.6 : 1;
  const crit = Math.random() < .12;
  const dmg = Math.max(1, Math.round(P.atk * mult * R(.9, 1.12) * (crit ? 1.8 : 1)));
  m.hp -= dmg; m.flash = .12;
  const hx = m.x, hy = GROUND - 55;
  burst(hx, hy, skill ? 16 : 7, skill ? ['#ffb347', '#ff6b35', '#fff'] : ['#fff', '#ffe066'], skill ? 220 : 140);
  dmgNum(hx, hy - 20, (skill ? 'POW ' : '') + dmg, crit, false);
  if (skill) { shake = 7; P.mp -= 12; P.skillT = 5; }
  if (m.hp <= 0 && !m.dead) {
    m.dead = 1; m.deadT = .45;
    P.kills++; P.gold += m.gold; gainExp(m.exp);
    burst(hx, hy, 18, ['#cfd8dc', '#90a4ae', '#fff'], 170);
    dmgNum(hx, hy - 44, '+' + m.gold + 'g', false, false);
    feed(m.type.name + ' slain  +' + m.exp + ' EXP');
  }
}
function monsterHit(m) {
  if (P.dead) return;
  const dmg = Math.max(1, m.atk - ((P.level / 2) | 0));
  P.hp -= dmg; P.hurtFlash = .35; shake = Math.max(shake, 3);
  dmgNum(P.x, GROUND - 110, '-' + dmg, false, true);
  burst(P.x, GROUND - 70, 6, ['#ff6b6b', '#fff'], 120);
  if (P.hp <= 0) {
    P.hp = 0; P.dead = 2.2;
    burst(P.x, GROUND - 60, 30, ['#90a4ae', '#546e7a'], 200);
    feed('You died! Respawning...');
  }
}

/* ---------------- update ---------------- */
function nearestMonster() {
  let best = null, bd = 1e9;
  for (const m of monsters) {
    if (m.dead) continue;
    const d = Math.abs(m.x - P.x);
    if (d < bd) { bd = d; best = m; }
  }
  return best;
}
function update(dt) {
  for (const c of clouds) { c.x += c.v * dt; if (c.x > W + 120) c.x = -120; }
  shake = Math.max(0, shake - dt * 22);
  P.hurtFlash = Math.max(0, P.hurtFlash - dt);

  // spawner keeps 5 monsters around
  spawnT -= dt;
  const alive = monsters.filter(m => !m.dead).length;
  if (spawnT <= 0 && alive < 5) { spawnMonster(); spawnT = 1.1; }

  if (P.dead > 0) {
    P.dead -= dt;
    if (P.dead <= 0) { P.hp = P.maxHp; P.mp = P.maxMp; P.x = W / 2; feed('Back on your feet.'); }
  } else {
    P.attackT -= dt; P.skillT -= dt; P.swing = Math.max(0, P.swing - dt);
    P.mp = Math.min(P.maxMp, P.mp + 3.2 * dt);
    const m = nearestMonster();
    let moving = false;
    if (m) {
      const dx = m.x - P.x;
      P.dir = dx >= 0 ? 1 : -1;
      if (Math.abs(dx) > 72) { P.x += P.dir * P.speed * dt; moving = true; }
      else if (P.attackT <= 0) {
        P.attackT = .72; P.swing = .28;
        if (P.skillT <= 0 && P.mp >= 12) playerAttack(m, true);
        else playerAttack(m, false);
      }
    } else {
      P.idleT -= dt;
      if (P.idleT <= 0) { P.idleT = R(1.5, 4); P.idleDir = Math.random() < .5 ? -1 : 1; }
      P.x = clamp(P.x + P.idleDir * P.speed * .35 * dt, 40, W - 40);
      moving = true; P.dir = P.idleDir;
    }
    if (moving) P.walkPhase += dt * 11;
    // hp regen out of combat
    const near = monsters.some(m => !m.dead && Math.abs(m.x - P.x) < 230);
    if (!near) P.hp = Math.min(P.maxHp, P.hp + 5 * dt);
  }

  for (const m of monsters) {
    m.flash = Math.max(0, m.flash - dt);
    if (m.dead) { m.deadT -= dt; continue; }
    m.hop += dt * 6;
    if (!P.dead) {
      const dx = P.x - m.x, adx = Math.abs(dx);
      if (adx < 150) {
        m.dir = dx >= 0 ? 1 : -1;
        if (adx > 52) m.x += m.dir * 42 * dt;
        else { m.attackT -= dt; if (m.attackT <= 0) { m.attackT = 1.35; monsterHit(m); } }
      } else {
        m.wanderT -= dt;
        if (m.wanderT <= 0) { m.wanderT = R(1, 3); m.dir = Math.random() < .5 ? -1 : 1; }
        m.x = clamp(m.x + m.dir * 26 * dt, 40, W - 40);
      }
    }
  }
  monsters = monsters.filter(m => !m.dead || m.deadT > 0);

  for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; }
  parts = parts.filter(p => p.life > 0);
  for (const d of dmgNums) { d.life -= dt; d.y += d.vy * dt; d.vy *= .94; }
  dmgNums = dmgNums.filter(d => d.life > 0);

  // zone label
  let z = ZONES[0][1];
  for (const [lv, name] of ZONES) if (P.level >= lv) z = name;
  document.getElementById('zone').textContent = z;
  updateHud();
}

/* ---------------- hud ---------------- */
const $ = id => document.getElementById(id);
function updateHud() {
  $('lv').textContent = P.level;
  $('hpFill').style.width = (100 * P.hp / P.maxHp) + '%';
  $('mpFill').style.width = (100 * P.mp / P.maxMp) + '%';
  $('xpFill').style.width = (100 * P.exp / expNext(P.level)) + '%';
  $('hpTxt').textContent = Math.ceil(P.hp) + ' / ' + P.maxHp;
  $('mpTxt').textContent = Math.floor(P.mp) + ' / ' + P.maxMp;
  $('xpTxt').textContent = P.exp + ' / ' + expNext(P.level);
  $('gold').textContent = P.gold;
  $('kills').textContent = P.kills;
  $('atk').textContent = P.atk;
}
$('speed').onclick = () => {
  speedMul = speedMul === 1 ? 2 : speedMul === 2 ? 4 : 1;
  $('speed').textContent = speedMul + 'x';
};

/* ---------------- draw ---------------- */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawBg(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#6db9f2'); g.addColorStop(.7, '#bfe3ff'); g.addColorStop(1, '#e8f7ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff8d6';
  ctx.beginPath(); ctx.arc(830, 90, 42, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (const c of clouds) {
    ctx.beginPath();
    ctx.arc(c.x, c.y, 26 * c.s, 0, 7);
    ctx.arc(c.x + 26 * c.s, c.y - 8 * c.s, 20 * c.s, 0, 7);
    ctx.arc(c.x + 52 * c.s, c.y, 24 * c.s, 0, 7);
    ctx.fill();
  }
  ctx.fillStyle = '#9ed69a';
  ctx.beginPath(); ctx.ellipse(200, GROUND + 30, 420, 120, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#8acb88';
  ctx.beginPath(); ctx.ellipse(760, GROUND + 40, 460, 130, 0, 0, 7); ctx.fill();
  // trees
  for (const tx of [120, 420, 700, 890]) {
    ctx.fillStyle = '#7a5230'; ctx.fillRect(tx - 7, GROUND - 70, 14, 70);
    ctx.fillStyle = '#3e9e4f';
    ctx.beginPath(); ctx.arc(tx, GROUND - 95, 34, 0, 7); ctx.fill();
    ctx.fillStyle = '#4fb862';
    ctx.beginPath(); ctx.arc(tx - 12, GROUND - 105, 20, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#7ec850'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#6ab04c'; ctx.fillRect(0, GROUND, W, 10);
  ctx.fillStyle = 'rgba(0,0,0,.06)';
  for (let i = 0; i < 24; i++) ctx.fillRect((i * 167 + t * 4) % W, GROUND + 30 + (i % 3) * 22, 46, 7);
}
function shadow(x, w) {
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.ellipse(x, GROUND + 4, w, 8, 0, 0, 7); ctx.fill();
}
function drawPlayer(t) {
  if (P.dead > 0 && ((t * 6) | 0) % 2 === 0) return; // blink while dead
  const x = P.x, bob = Math.sin(P.walkPhase) * 3, d = P.dir;
  shadow(x, 26);
  const by = GROUND + bob;
  ctx.save(); ctx.translate(x, by); ctx.scale(d, 1);
  // legs
  const lp = Math.sin(P.walkPhase) * 7;
  ctx.fillStyle = '#2c3e50';
  ctx.fillRect(-11, -26 + Math.max(0, lp), 9, 26 - Math.max(0, lp));
  ctx.fillRect(2, -26 + Math.max(0, -lp), 9, 26 - Math.max(0, -lp));
  // body armor
  ctx.fillStyle = '#3a7bd5'; rr(-14, -62, 28, 38, 9); ctx.fill();
  ctx.fillStyle = '#2c5fa8'; ctx.fillRect(-14, -38, 28, 7);
  ctx.fillStyle = '#ffd76a'; ctx.fillRect(-4, -38, 8, 7);
  // arm + sword
  ctx.fillStyle = '#3a7bd5'; rr(8, -56, 10, 24, 5); ctx.fill();
  const sw = P.swing > 0 ? (0.28 - P.swing) / 0.28 : 0;
  ctx.save();
  ctx.translate(14, -46); ctx.rotate(-0.6 + sw * 2.2);
  ctx.fillStyle = '#8a6d3b'; ctx.fillRect(-3, 0, 6, 12);
  ctx.fillStyle = '#dfe6ee'; ctx.fillRect(-4, -44, 8, 46);
  ctx.fillStyle = '#fff'; ctx.fillRect(-4, -44, 3, 46);
  ctx.restore();
  if (P.swing > 0) {
    ctx.strokeStyle = 'rgba(255,255,255,' + (P.swing / .28 * .9) + ')';
    ctx.lineWidth = 7; ctx.beginPath();
    ctx.arc(20, -44, 44, -1.2 + sw * 1.4, -0.2 + sw * 1.4); ctx.stroke();
  }
  // head
  ctx.fillStyle = '#ffcf9e';
  ctx.beginPath(); ctx.arc(0, -76, 15, 0, 7); ctx.fill();
  // helmet
  ctx.fillStyle = '#546e7a';
  ctx.beginPath(); ctx.arc(0, -79, 16, Math.PI, 0); ctx.fill();
  ctx.fillRect(-16, -81, 32, 5);
  ctx.fillStyle = '#ff5252'; ctx.fillRect(-3, -102, 6, 10); // plume
  // eyes
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(5, -76, 2.4, 0, 7); ctx.fill();
  ctx.restore();
  // mp skill ready glow
  if (P.skillT <= 0 && P.mp >= 12) {
    ctx.strokeStyle = 'rgba(255,183,77,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, GROUND - 55 + bob, 34 + Math.sin(t * 5) * 3, 0, 7); ctx.stroke();
  }
}
function drawMonster(m, t) {
  const squash = 1 + Math.sin(m.hop) * .08, x = m.x;
  const alpha = m.dead ? Math.max(0, m.deadT / .45) : 1;
  ctx.save(); ctx.globalAlpha = alpha;
  shadow(x, 24);
  const rise = m.dead ? (0.45 - m.deadT) * 160 : 0;
  const y = GROUND - rise;
  ctx.translate(x, y); ctx.scale(m.dir, 1);
  const flash = m.flash > 0;
  const F = (c1, c2) => flash ? '#fff' : c1;
  if (m.kind === 'slime' || m.kind === 'dslime') {
    const c = m.kind === 'dslime' ? '#6a1b9a' : '#66bb6a';
    const cd = m.kind === 'dslime' ? '#4a148c' : '#43a047';
    ctx.fillStyle = F(c); ctx.beginPath();
    ctx.ellipse(0, -26 / squash, 26, 26 * squash, 0, 0, 7); ctx.fill();
    ctx.fillStyle = F(cd); ctx.beginPath();
    ctx.ellipse(-8, -18 / squash, 7, 9 * squash, -.3, 0, 7); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(6, -30, 3.4, 0, 7); ctx.arc(15, -30, 3.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(7, -31, 1.2, 0, 7); ctx.arc(16, -31, 1.2, 0, 7); ctx.fill();
  } else if (m.kind === 'mush' || m.kind === 'fmush') {
    const cap = m.kind === 'fmush' ? '#e53935' : '#fb8c00';
    ctx.fillStyle = '#fff3e0'; rr(-11, -30, 22, 30, 8); ctx.fill();
    ctx.fillStyle = F(cap);
    ctx.beginPath(); ctx.arc(0, -30, 26, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#fff';
    for (const [sx, sy] of [[-13, -44], [2, -52], [14, -42]]) {
      ctx.beginPath(); ctx.arc(sx, sy, 4.5, 0, 7); ctx.fill();
    }
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(-5, -18, 2.6, 0, 7); ctx.arc(6, -18, 2.6, 0, 7); ctx.fill();
    ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -12, 5, .3, Math.PI - .3); ctx.stroke();
    if (m.kind === 'fmush' && Math.random() < .3)
      parts.push({ x: x + R(-14, 14), y: y - 58, vx: R(-15, 15), vy: R(-70, -30),
        life: .4, max: .4, c: '#ff9800', sz: R(2, 4) });
  } else { // pig
    ctx.fillStyle = F('#f8bbd0');
    ctx.beginPath(); ctx.ellipse(0, -28, 30, 22, 0, 0, 7); ctx.fill();
    ctx.fillStyle = F('#f48fb1');
    ctx.beginPath(); ctx.ellipse(20, -24, 11, 9, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#d81b60';
    ctx.beginPath(); ctx.arc(23, -24, 2, 0, 7); ctx.arc(28, -24, 2, 0, 7); ctx.fill();
    ctx.fillStyle = F('#f48fb1');
    ctx.beginPath(); ctx.moveTo(-18, -46); ctx.lineTo(-24, -58); ctx.lineTo(-12, -50); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-4, -48); ctx.lineTo(-4, -60); ctx.lineTo(6, -50); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(8, -34, 3, 0, 7); ctx.fill();
  }
  ctx.restore();
  // hp bar
  if (!m.dead && m.hp < m.maxHp) {
    const w = 52, px = x - w / 2, py = y - (m.kind === 'pig' ? 62 : 66);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; rr(px - 1, py - 1, w + 2, 9, 4); ctx.fill();
    ctx.fillStyle = '#ff5252'; rr(px, py, w * clamp(m.hp / m.maxHp, 0, 1), 7, 3); ctx.fill();
  }
}
function draw(t) {
  ctx.save();
  if (shake > 0) ctx.translate(R(-shake, shake), R(-shake, shake));
  drawBg(t);
  const order = [...monsters].sort((a, b) => a.x - b.x);
  for (const m of order) drawMonster(m, t);
  drawPlayer(t);
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const d of dmgNums) {
    ctx.globalAlpha = clamp(d.life / .9, 0, 1);
    ctx.font = d.crit ? '900 30px "Trebuchet MS"' : d.hurt ? 'bold 20px "Trebuchet MS"' : 'bold 22px "Trebuchet MS"';
    ctx.fillStyle = d.hurt ? '#ff5252' : d.crit ? '#ffd600' : '#fff';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
    ctx.strokeText(d.txt, d.x, d.y); ctx.fillText(d.txt, d.x, d.y);
  }
  ctx.globalAlpha = 1;
  if (P.hurtFlash > 0) {
    ctx.strokeStyle = 'rgba(255,40,40,' + P.hurtFlash * 1.4 + ')';
    ctx.lineWidth = 26; ctx.strokeRect(0, 0, W, H);
  }
  ctx.restore();
}

/* ---------------- main ---------------- */
let last = performance.now();
function frame(now) {
  let dt = Math.min(.05, (now - last) / 1000); last = now;
  dt *= speedMul;
  update(dt);
  draw(now / 1000);
  requestAnimationFrame(frame);
}
for (let i = 0; i < 5; i++) spawnMonster();
feed('Welcome to Idle Adventure. Slay away.');
requestAnimationFrame(frame);
})();
</script>
